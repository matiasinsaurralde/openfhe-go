name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64]
    
    container:
      image: ghcr.io/matiasinsaurralde/openfhe-buildbox:1.3.1
      options: --user root
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.3'
    
    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.57.2
    
    - name: Run golangci-lint
      run: |
        $(go env GOPATH)/bin/golangci-lint run --timeout=5m --build-tags=openfhe

  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        platform: [linux/amd64]
    
    container:
      image: ghcr.io/matiasinsaurralde/openfhe-buildbox:1.3.1
      options: --user root
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.3'
    
    - name: Download dependencies
      run: go mod download
    
    - name: Build
      run: go build -tags openfhe -o openfhe-go .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        platform: [linux/amd64]
    
    container:
      image: ghcr.io/matiasinsaurralde/openfhe-buildbox:1.3.1
      options: --user root
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.3'
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests with race detection
      run: go test -v -race -tags openfhe 
