run:
  timeout: 10m
  modules-download-mode: readonly
  build-tags:
    - openfhe

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gci
    - gofmt
    - goimports
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
    - whitespace
    - gocyclo
    - dupl
    - gocritic
    - goconst
    - bodyclose
    - exportloopref
    - gofumpt
    - makezero
    - nilerr
    - prealloc
    - rowserrcheck
    - wastedassign
    - asciicheck
    - durationcheck
    - errorlint
    - forcetypeassert
    - nolintlint
    - predeclared
    - usestdlibvars
    - wrapcheck
    - contextcheck
    - exhaustive
    - stylecheck
    - lll
    - nakedret
    - cyclop
    - funlen
    - gocognit
    - gomodguard
    - maintidx
    - nestif
    - testpackage
    - thelper
    - tparallel
    - containedctx
    - decorder
    - errname
    - interfacebloat
    - ireturn
    - varnamelen
    - wsl
    - dogsled
    - grouper
    - importas
    - godot
    - nonamedreturns
    - tagalign
    - zerologlint
    - dupword
    - mirror
    - testifylint
    - gosmopolitan
    - copyloopvar
    - fatcontext
    - testableexamples
    - protogetter
    - mnd
    - perfsprint

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    check-shadowing: true
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  
  gocyclo:
    min-complexity: 15
  
  cyclop:
    max-complexity: 15
  
  dupl:
    threshold: 100
  
  goconst:
    min-len: 3
    min-occurrences: 3
  
  misspell:
    locale: US
  
  lll:
    line-length: 120
  
  gofmt:
    simplify: true
  
  goimports:
    local-prefixes: github.com/collapsinghierarchy/openfhe-go
  
  funlen:
    lines: 100
    statements: 50
  
  gocognit:
    min-complexity: 20
  
  nestif:
    min-complexity: 5
  
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - unnamedResult
      - whyNoLint
      - wrapperFunc
      - hugeParam
      - rangeValCopy
      - exitAfterDefer
      - captLocal
      - commentedOutCode
      - singleCaseSwitch
      - ifElseChain
      - octalLiteral
      - flagDeref
      - dupImport
      - assignOp
      - caseOrder
      - defaultCaseOrder
      - dupArg
      - dupBranchBody
      - dupCase
      - dupSubExpr
      - elseif
      - emptyFallthrough
      - equalFold
      - flagName
      - mapKey
      - regexpMust
      - sloppyLen
      - switchTrue
      - typeSwitchVar
      - underef
      - unlambda
      - unnecessaryBlock
      - yodaStyleExpr
  
  revive:
    severity: warning
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers", "sayRepetitiveInsteadOfStutters"]
      - name: var-naming
      - name: var-declaration
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: indent-error-flow
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unreachable-code
      - name: unused-parameter
      - name: unused-receiver
      - name: constant-logical-expr
      - name: bool-literal-in-expr
      - name: redefines-builtin-id
      - name: function-result-limit
        arguments: [3]
      - name: imports-blacklist
      - name: range-loop-condition
      - name: waitgroup-by-value
      - name: atomic
      - name: call-to-gc
      - name: duplicated-imports
      - name: string-of-int
      - name: defer
      - name: unconditional-recursion
      - name: identical-branches
      - name: get-return
      - name: modifies-parameter
      - name: confusing-naming
      - name: deep-exit
      - name: unhandled-error
      - name: cognitive-complexity
        arguments: [20]
      - name: argument-limit
        arguments: [6]
      - name: cyclomatic
        arguments: [15]
      - name: line-length-limit
        arguments: [120]
      - name: function-length
        arguments: [50, 100]
      - name: confusing-results
      - name: early-return
      - name: empty-lines
      - name: flag-parameter
      - name: struct-tag
      - name: superfluous-else
      - name: use-any
      - name: useless-break
      - name: optimize-operands-order
      - name: redundant-import-alias
      - name: empty-block
      - name: add-constant
      - name: nested-structs
      - name: datarace
      - name: string-format
      - name: enforce-map-style
      - name: enforce-slice-style
      - name: unexported-naming

  mnd:
    settings:
      mnd:
        checks:
          - argument
          - case
          - condition
          - operation
          - return
          - assign
        ignored-numbers:
          - '0'
          - '1'
          - '2'
          - '3'
          - '8'
          - '16'
          - '32'
          - '64'
          - '128'
          - '256'
          - '512'
          - '1024'
          - '2048'
          - '4096'
          - '8192'
          - '16384'
          - '32768'
          - '65536'
          - '65537'
          - '42'
          - '10'
          - '100'
          - '1000'
          - '10000'
          - '100000'
          - '1000000'
        ignored-functions:
          - 'math.*'
          - 'strconv.*'
          - 'make'
          - 'new'
          - 'time.Duration'
          - 'time.*'
          - 'context.WithTimeout'
          - 'context.WithDeadline'
          - 'os.Exit'
          - 'os.Chmod'
          - 'syscall.*'
          - 'C.*'

  varnamelen:
    min-name-length: 2
    ignore-type-assert-ok: true
    ignore-map-index-ok: true
    ignore-chan-recv-ok: true
    ignore-decls:
      - c C.uint
      - t *testing.T
      - i int
      - j int
      - k int
      - v interface{}
      - w http.ResponseWriter
      - r *http.Request
      - pk *PublicKey
      - sk *SecretKey
      - ct *Ciphertext
      - buf *C.uint8_t
      - ptr unsafe.Pointer
      - err error
      - ctx context.Context
      - db *sql.DB
      - tx *sql.Tx
      - wg *sync.WaitGroup
      - mu *sync.Mutex
      - rw *sync.RWMutex
      - ch chan
      - ok bool
      - id string
      - to time.Duration
      - fn func
      - f *os.File
      - b []byte
      - n int
      - s string
      - x int
      - y int
      - z int

issues:
  exclude:
    # CGO-specific exclusions
    - "should have a package comment"
    - "should have comment or be unexported"
    - "exported .* should have comment or be unexported"
    - "comment on exported .* should be of the form"
    - "don't use ALL_CAPS in Go names"
    - "should be.*instead of.*"
    - "should drop.*be.*"
    - "package-comments"
    - "ST1000"
    - "ST1003"
    - "ST1016"
    - "ST1020"
    - "ST1021"
    - "ST1022"
    - "ST1023"
    - "Line contains TODO/BUG/FIXME"
    # Allow magic numbers for OpenFHE parameters
    - "Magic number: 2"
    - "Magic number: 65537"
    - "Magic number: 42"
    - "Magic number: 10"
    - "Magic number: 32"
    - "mnd: Magic number: 2"
    - "mnd: Magic number: 65537"
    - "mnd: Magic number: 42"
    - "mnd: Magic number: 10"
    - "mnd: Magic number: 32"
    # Allow short variable names for CGO
    - "variable name 'c' is too short"
    - "variable name 't' is too short"
    - "variable name 'i' is too short"
    - "variable name 'j' is too short"
    - "variable name 'k' is too short"
    - "variable name 'v' is too short"
    - "variable name 'w' is too short"
    - "variable name 'r' is too short"
    - "variable name 'pk' is too short"
    - "variable name 'sk' is too short"
    - "variable name 'ct' is too short"
    - "variable name 'buf' is too short"
    - "variable name 'ptr' is too short"
    - "variable name 'err' is too short"
    - "variable name 'ctx' is too short"
    - "variable name 'db' is too short"
    - "variable name 'tx' is too short"
    - "variable name 'wg' is too short"
    - "variable name 'mu' is too short"
    - "variable name 'rw' is too short"
    - "variable name 'ch' is too short"
    - "variable name 'ok' is too short"
    - "variable name 'id' is too short"
    - "variable name 'to' is too short"
    - "variable name 'fn' is too short"
    - "variable name 'f' is too short"
    - "variable name 'b' is too short"
    - "variable name 'n' is too short"
    - "variable name 's' is too short"
    - "variable name 'x' is too short"
    - "variable name 'y' is too short"
    - "variable name 'z' is too short"
    # Allow unsafe operations required for CGO
    - "use of `unsafe` should be audited"
    - "G103: Use of unsafe calls should be audited"
    # Allow specific patterns for CGO bindings
    - "cyclomatic complexity .* of func .* is high"
    - "cognitive complexity .* of func .* is high"
    - "function-length"
    - "line-length-limit"
    - "Function name will be used as .* by other packages"
    - "exported function .* should have comment or be unexported"
    - "exported type .* should have comment or be unexported"
    - "exported method .* should have comment or be unexported"
    - "exported const .* should have comment or be unexported"
    - "exported var .* should have comment or be unexported"
    - "type name will be used as .* by other packages"
    - "const .* should be .*"
    - "var .* should be .*"
    - "func .* should be .*"
    - "type .* should be .*"
    - "method .* should be .*"
    - "struct field .* should be .*"
    - "interface .* should be .*"
    - "package .* should be .*"
    - "redundant import alias"
    - "empty-block"
    - "add-constant"
    - "nested-structs"
    - "datarace"
    - "string-format"
    - "enforce-map-style"
    - "enforce-slice-style"
    - "unexported-naming"
    - "unreachable-code"
    - "unused-parameter"
    - "unused-receiver"
    - "useless-break"
    - "var-naming"
    - "waitgroup-by-value"
    - "indent-error-flow"
    - "range"
    - "receiver-naming"
    - "time-naming"
    - "context-as-argument"
    - "context-keys-type"
    - "dot-imports"
    - "error-return"
    - "error-strings"
    - "error-naming"
    - "exported"
    - "if-return"
    - "increment-decrement"
    - "package-comments"
    - "var-declaration"
    - "blank-imports"
    - "bool-literal-in-expr"
    - "constant-logical-expr"
    - "redefines-builtin-id"
    - "function-result-limit"
    - "imports-blacklist"
    - "range-loop-condition"
    - "atomic"
    - "call-to-gc"
    - "duplicated-imports"
    - "string-of-int"
    - "defer"
    - "unconditional-recursion"
    - "identical-branches"
    - "get-return"
    - "modifies-parameter"
    - "confusing-naming"
    - "deep-exit"
    - "unhandled-error"
    - "cognitive-complexity"
    - "argument-limit"
    - "cyclomatic"
    - "file-header"
    - "max-public-structs"
    - "banned-characters"
    - "confusing-results"
    - "early-return"
    - "empty-lines"
    - "flag-parameter"
    - "struct-tag"
    - "superfluous-else"
    - "use-any"
    - "useless-break"
    - "optimize-operands-order"
    - "redundant-import-alias"
    - "empty-block"
    - "add-constant"
    - "nested-structs"
    - "datarace"
    - "string-format"
    - "enforce-map-style"
    - "enforce-slice-style"
    - "unexported-naming"
    - "unreachable-code"
    - "unused-parameter"
    - "unused-receiver"
    - "useless-break"
    - "var-naming"
    - "waitgroup-by-value"
  
  exclude-use-default: false
  exclude-case-sensitive: false
  
  max-issues-per-linter: 0
  max-same-issues: 0
  
  new: false
  
  fix: false